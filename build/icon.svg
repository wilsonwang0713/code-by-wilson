<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="#101013"/>

    <!-- instrument face: one white line weight family, level wings over a gently banked horizon -->
    <g stroke="#F5F5F7" fill="none" stroke-linecap="round">
      <circle cx="512" cy="512" r="298" stroke-width="20"/>
      <g transform="rotate(-6 512 512)">
        <line x1="250" y1="512" x2="774" y2="512" stroke-width="16"/>
        <!-- pitch ladder -->
        <line x1="472" y1="430" x2="552" y2="430" stroke-width="10" opacity="0.45"/>
        <line x1="472" y1="594" x2="552" y2="594" stroke-width="10" opacity="0.45"/>
      </g>
    </g>

    <!-- fixed wing marker: a tile-colored halo punches a clean gap out of the horizon behind it -->
    <g fill="#F5F5F7" stroke="#101013" stroke-width="12" paint-order="stroke">
      <rect x="360" y="502" width="88" height="20" rx="10"/>
      <rect x="576" y="502" width="88" height="20" rx="10"/>
      <circle cx="512" cy="512" r="16"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
</svg>
