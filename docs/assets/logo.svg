<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="FlightDeck">
  <rect x="10" y="10" width="200" height="200" rx="46" fill="#101013"/>
  <rect x="11.5" y="11.5" width="197" height="197" rx="44.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- instrument face: one white line weight family, level wings over a gently banked horizon -->
  <g stroke="#F5F5F7" fill="none" stroke-linecap="round">
    <circle cx="110" cy="110" r="72.3" stroke-width="4.9"/>
    <g transform="rotate(-6 110 110)">
      <line x1="46.4" y1="110" x2="173.6" y2="110" stroke-width="3.9"/>
      <!-- pitch ladder -->
      <line x1="100.3" y1="90.1" x2="119.7" y2="90.1" stroke-width="2.4" opacity="0.45"/>
      <line x1="100.3" y1="129.9" x2="119.7" y2="129.9" stroke-width="2.4" opacity="0.45"/>
    </g>
  </g>

  <!-- fixed wing marker: a tile-colored halo punches a clean gap out of the horizon behind it -->
  <g fill="#F5F5F7" stroke="#101013" stroke-width="2.9" paint-order="stroke">
    <rect x="73.1" y="107.6" width="21.4" height="4.9" rx="2.4"/>
    <rect x="125.5" y="107.6" width="21.4" height="4.9" rx="2.4"/>
    <circle cx="110" cy="110" r="3.9"/>
  </g>
</svg>
